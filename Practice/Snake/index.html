<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanke Project 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="section">
        <div class="infos">
          <div class="info">
            <h3>
              High-score:
              <span id="high-score">00</span>
            </h3>
          </div>
          <div class="info">
            <h3>
              Score:
              <span id="score">00</span>
            </h3>
          </div>
          <div class="info">
            <h3>
              Timer:
              <span id="time">00:00</span>
            </h3>
          </div>
        </div>
        <div class="board"></div>
      </div>
      <div class="menu">
        <div class="start">
          <h3>Welcome to the game</h3>
          <button id="forstart">Tap play</button>
        </div>
        <div class="restart">
          <h3>Welcome again</h3>
          <button id="forrestart">Play again</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>

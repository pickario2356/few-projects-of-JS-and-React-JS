<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right">
          <button id="toggle-modal">Add new task</button>
        </div>
      </nav>
      <section class="board">
        <div id="to-do" class="task-column">
          <div class="heading">
            <div class="left">To Do</div>
            <div class="right">Count</div>
          </div>
        </div>
        <div id="progress" class="task-column">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
        </div>
        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count</div>
          </div>
        </div>
      </section>
    </main>

    <div class="modal add-new-task">
      <div class="bg"></div>
      <div class="center">
        <input type="text" placeholder="Task Title" id="text-title-content" />
        <textarea
          placeholder="Enter the decription"
          id="text-area-content"
        ></textarea>
        <button id="add-new-task" class="add-task-button">Add new task</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

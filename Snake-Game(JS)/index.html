<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <section>
        <div class="infos">
          <div class="info">
            <h3>
              Hight Score:
              <span id="high-score">0</span>
            </h3>
          </div>
          <div class="info">
            <h3>
              Score:
              <span id="score">0</span>
            </h3>
          </div>
          <div class="info">
            <h3>
              Time:
              <span id="time">00:00</span>
            </h3>
          </div>
        </div>
        <div class="board">
        </div>
      </section>
      <div class="modal">
        <div class="startgame">
          <h3>Welcome to Snake world </h3>
          <button class="btn play">Click to play</button>
        </div>
        <div class="gameover">
          <h3>Game over</h3>
          <button class="btn restart">Play again</button>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
